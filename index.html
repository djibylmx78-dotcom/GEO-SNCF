<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Géographie ferroviaire de France</title>
<style>

:root[data-theme="dark"]{--bg:#0a1120;--fg:#e7ecf6;--mut:#94a1bf;--card:#131c30;--land:#3f3c27;--line:#6d6839;--sea:#0e192b;--acc:#7aa7ff;--acc2:#0f2a66;--ok:#4ade80;--bad:#ff7b7b;--bd:#223049;--sh:0 6px 20px rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.hero{background:linear-gradient(135deg,var(--acc2),#1d4ed8);color:#fff;padding:18px 16px 54px}
.hero div{max-width:760px;margin:0 auto}
.hero h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.hero p{margin:4px 0 0;opacity:.8;font-size:.9rem}
main{max-width:760px;margin:-40px auto 0;padding:0 12px 28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px}
.st{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.pill{font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pbar{height:8px;border-radius:99px;background:var(--bd);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .35s ease}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:10px}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:11px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 2px 8px rgba(20,33,61,.12)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border-radius:99px;padding:7px 14px;font-size:.9rem;background:var(--bg);color:var(--mut);border:1px solid var(--bd)}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.ask{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20;text-align:center;border-top:3px solid var(--acc)}
.ask small,#selT{display:block;color:var(--mut);font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.ask b{display:block;font-size:1.75rem;line-height:1.2;margin-top:2px;letter-spacing:-.01em}
#fb,#fbP{min-height:1.3em;margin-top:6px;font-weight:600}
.ok{color:var(--ok)}.ko{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bd);background:var(--bg);color:var(--fg);outline:none}
.row input:focus{border-color:var(--acc)}
.row2{display:flex;gap:8px;justify-content:center;margin-top:10px}
.sug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.sug button{padding:8px 14px;font-size:.95rem;border-radius:99px;background:color-mix(in srgb,var(--acc) 12%,transparent);color:var(--acc);border-color:transparent;font-weight:600}
button,select{font:inherit;padding:10px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
button.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4;cursor:default}
.lg{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 10px}
.lg label{display:flex;align-items:center;gap:6px;font-size:.85rem;padding:6px 11px;border-radius:99px;background:var(--card);border:1px solid var(--bd)}
.lg input{accent-color:var(--acc);margin:0}
.lg i{display:inline-block;width:20px;border-top:3px solid}
.wrap{overflow:auto;max-height:68vh;border-radius:18px;border:1px solid var(--bd);box-shadow:var(--sh);background:var(--sea)}
svg{width:100%;height:auto;display:block;background:radial-gradient(120% 90% at 30% 15%,color-mix(in srgb,var(--sea) 70%,#fff),var(--sea));cursor:crosshair;touch-action:manipulation}
.land0{fill:var(--line);stroke:var(--line);stroke-width:13;stroke-linejoin:round}
.land{fill:var(--land);stroke:var(--land);stroke-width:11;stroke-linejoin:round}
.ln{fill:none;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.ln.T{stroke:var(--mut);stroke-width:1;opacity:.7}.ln.I{stroke:var(--acc);stroke-width:1.8;opacity:.85}.ln.L{stroke:var(--fg);stroke-width:3}
.noL .L,.noI .I,.noT .T{display:none}
.lbl{font-size:9.5px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
#dots circle{filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.35))}
.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.res{animation:in .35s ease}
.res ul{list-style:none;margin:8px 0;padding:0;max-height:300px;overflow-y:auto}
.res li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.res button{margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hint{color:var(--mut);font-size:.82rem;text-align:center;margin-top:6px}
</style>
</head>

<header class="hero"><div><h1>🚄 Géographie ferroviaire de France</h1><p>Place ou nomme les villes et gares de la carte</p></div></header>
<main>
<section class="card"><div class="st"><span id="prog"></span><span id="score" class="pill"></span></div><div class="pbar"><i id="pfill"></i></div></section>

<select id="reg"><option value="all">France entière</option><option value="nord">Nord</option><option value="sud">Sud</option><option value="est">Est</option><option value="ouest">Ouest</option><option value="centre">Centre</option></select>

<div class="wrap"><svg id="map" viewBox="0 0 620 610" role="img" aria-label="Carte de France">

</svg></div>
<div class="btns"><button id="zm">🔍 Zoom ×1</button><button id="restart">↺ Recommencer</button></div>
<div class="hint">Astuce : zoome ×2 ou ×3 pour viser les zones denses (Paris, Nord, Côte d’Azur).</div>
<div id="end"></div>
</main>

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/œ/g,"oe").replace(/[^a-z0-9]+/g," ").replace(/\bsaint\b/g,"st").replace(/\bsainte\b/g,"ste").replace(/ /g,"")}
function lev(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const q=[i];for(let j=1;j<=n;j++)q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=q}return p[n]}
function vars(n){const v=[n],p=n.match(/^(.*?)\s*\((.*)\)$/);if(p)v.push(p[1],p[2]);const t=n.replace(/\bTGV\b/,"").replace(/\s+/g," ").trim();if(t!==n&&!CITIES.some(c=>c.n===t))v.push(t);return v.concat(AL[n]||[])}
const tol=n=>n<5?0:n<9?1:n<13?2:3;
function check(inp,c){const a=norm(inp);if(!a)return null;let best=99;for(const v of vars(c.n)){const b=norm(v),d=lev(a,b);if(d<=tol(b.length)&&d<best)best=d}return best<99?{exact:best===0}:null}
function sugg(txt){const a=norm(txt);if(!a)return[];const P=[],W=[];for(const c of POOL){const vs=vars(c.n);if(vs.some(v=>norm(v).startsWith(a)))P.push(c.n);else if(a.length>=2&&vs.some(v=>v.split(/[\s-]+/).some(w=>norm(w).startsWith(a))))W.push(c.n)}
 const s=n=>n.localeCompare(n);return P.sort((x,y)=>x.localeCompare(y,"fr")).concat(W.sort((x,y)=>x.localeCompare(y,"fr"))).slice(0,6)}

let MODE="placer",POOL=CITIES,total=0,sel=null,nf=0,nr=0,ne=0,queue=[],qi=0,pok=0,pres=[],pdone=false,ptotal=0;
const ST={},ERR={},DOT={},dg=$("dots"),lb=$("lbls");
CITIES.forEach(q=>{const e=document.createElementNS(NS,"circle");e.setAttribute("cx",X(q.lo));e.setAttribute("cy",Y(q.la));e.setAttribute("stroke","#fff");dg.appendChild(e);DOT[q.n]=e});
function paint(c){const e=DOT[c.n],s=ST[c.n],on=sel===c;if(!POOL.includes(c)){e.setAttribute("fill","#9aa0a6");e.setAttribute("r",2.2);e.setAttribute("opacity",.55);e.setAttribute("stroke-width","0.8");return}
 e.setAttribute("opacity",1);e.setAttribute("fill",MODE=="nommer"?(s=="found"?"#1a8f4a":s=="rev"?"#e08a1e":on?"#1f5fbf":"#d93a3a"):"#d93a3a");e.setAttribute("r",on?5.5:3.4);e.setAttribute("stroke-width",on?"2":"0.8")}
function label(c){const t=document.createElementNS(NS,"text");t.setAttribute("x",X(c.lo)+6);t.setAttribute("y",Y(c.la)-5);t.setAttribute("class","lbl");t.textContent=c.n;lb.appendChild(t)}
const fbN=(t,k)=>{$("fb").className=k||"";$("fb").textContent=t},fbP=(t,k)=>{$("fbP").className=k||"";$("fbP").textContent=t};
function upd(){let f;if(MODE=="placer"){f=ptotal?pok/ptotal:0;$("prog").textContent="Validées : "+pok+" / "+ptotal;$("score").textContent="Erreurs : "+pres.filter(r=>!r.good).length}else{f=total?(nf+nr)/total:0;$("prog").textContent="Trouvées : "+nf+" / "+total;$("score").textContent="Erreurs : "+ne}$("pfill").style.width=Math.round(100*f)+"%"}
/* ---- Jeu 1 : je place la ville ---- */
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function pStart(list){queue=shuffle(list);ptotal=list.length;qi=0;pok=0;pres=[];$("end").innerHTML="";pShow()}
function requeue(c){const rem=queue.length-qi-1,lo=rem>=3?qi+3:qi+1,pos=lo+Math.floor(Math.random()*(queue.length-lo+1));queue.splice(pos,0,c)}
function pShow(){mk.innerHTML="";pdone=false;fbP("");$("next").disabled=true;$("next").textContent="Suivante";$("skip").disabled=false;if(qi>=queue.length)return pFinish();$("city").textContent=queue[qi].n;upd()}
function dotM(x,y,col,r){const e=document.createElementNS(NS,"circle");e.setAttribute("cx",x);e.setAttribute("cy",y);e.setAttribute("r",r);e.setAttribute("fill",col);e.setAttribute("stroke","#fff");e.setAttribute("stroke-width","1.2");mk.appendChild(e)}
function showAns(c,t,good){const tx=X(c.lo),ty=Y(c.la);if(t){const ln=document.createElementNS(NS,"line");ln.setAttribute("x1",X(t.lo));ln.setAttribute("y1",Y(t.la));ln.setAttribute("x2",tx);ln.setAttribute("y2",ty);ln.setAttribute("stroke",good?"var(--ok)":"var(--bad)");ln.setAttribute("stroke-dasharray","3 3");mk.appendChild(ln);dotM(X(t.lo),Y(t.la),"var(--acc)",4)}
 dotM(tx,ty,"var(--ok)",5);const l=document.createElementNS(NS,"text");l.setAttribute("x",tx+7);l.setAttribute("y",ty-6);l.setAttribute("class","lbl");l.textContent=c.n;mk.appendChild(l)}
function pEnd(){$("next").disabled=false;$("next").textContent=qi+1>=queue.length?"Résultats":"Suivante";$("skip").disabled=true;upd()}
function pTap(t){if(pdone||qi>=queue.length)return;const c=queue[qi],good=t===c;pdone=true;if(good)pok++;else requeue(c);pres.push({c,good});showAns(c,t,good);
 fbP(good?"✓ Bonne réponse":"✗ Tu as choisi "+t.n+" — la bonne est à "+Math.round(km(t.la,t.lo,c.la,c.lo))+" km",good?"ok":"ko");pEnd()}
$("skip").onclick=()=>{if(pdone||qi>=queue.length)return;const c=queue[qi];pdone=true;requeue(c);pres.push({c,good:false});showAns(c,null);fbP("Passée — voilà où elle se trouve","ko");pEnd()};
$("next").onclick=()=>{qi++;pShow()};
function pFinish(){$("city").textContent="Terminé !";$("next").disabled=true;$("skip").disabled=true;const F={};pres.forEach(r=>{if(!r.good)F[r.c.n]=(F[r.c.n]||0)+1});const bad=Object.keys(F).sort((a,b)=>F[b]-F[a]),first=ptotal-bad.length;
 $("end").innerHTML='<div class="res"><b>Réussies du premier coup : '+first+" / "+ptotal+" ("+Math.round(100*first/ptotal)+" %)</b><ul>"+(bad.map(n=>"<li><span>"+n+'</span><span class="ko">'+F[n]+" erreur"+(F[n]>1?"s":"")+"</span></li>").join("")||"<li><span>Aucune erreur 🎉</span></li>")+"</ul>"+(bad.length?'<button id="errs">Revoir mes erreurs</button>':"")+"</div>";

function setSel(c){const o=sel;sel=c;if(o)paint(o);if(c)paint(c);["inp","okb","hint","rev"].forEach(id=>$(id).disabled=!c);$("selT").textContent=c?"Point sélectionné — quel est son nom ?":"Touchez un point rouge";$("inp").value="";$("sug").innerHTML="";if(c)$("inp").focus()}
function judge(r,c){

 else{ne++;ERR[c.n]=(ERR[c.n]||0)+1;fbN("✗ Ce n’est pas ça, réessaie","ko");$("inp").select()}

function go(){if(!sel||!$("inp").value.trim())return;judge(check($("inp").value,sel),sel)}

function chk(){if(nf+nr<total)return;const bad=Object.keys(ERR).sort((a,b)=>ERR[b]-ERR[a]);$("selT").textContent="Terminé !";$("end").innerHTML='<div class="res"><b>Trouvées : '+nf+" / "+total+" · Révélées : "+nr+" · Erreurs : "+ne+"</b><ul>"+(bad.map(n=>"<li><span>"+n+'</span><span class="ko">'+ERR[n]+" erreur"+(ERR[n]>1?"s":"")+"</span></li>").join("")||"<li><span>Aucune erreur 🎉</span></li>")+"</ul></div>"}

svg.addEventListener("click",ev=>{const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const p=pt.matrixTransform(svg.getScreenCTM().inverse());let t=null,b=11;for(const q of POOL){const d=Math.hypot(X(q.lo)-p.x,Y(q.la)-p.y);if(d<b){b=d;t=q}}
 if(!t)return;if(MODE=="placer")return pTap(t);
 if(ST[t.n]){setSel(null);fbN((ST[t.n]=="found"?"✓ ":"Réponse : ")+t.n,ST[t.n]=="found"?"ok":"ko");return}
 fbN("");setSel(t)});
function reset(){const v=$("reg").value;POOL=v=="all"?CITIES:CITIES.filter(c=>c.r==v);total=POOL.length;MODE=$("mode").value;

 $("pP").hidden=MODE!="placer";$("pN").hidden=MODE!="nommer";["inp","okb","hint","rev"].forEach(id=>$(id).disabled=true);$("selT").textContent="Touchez un point rouge";$("inp").value="";$("sug").innerHTML="";

function seg(id,cls){const o=$(id),box=document.createElement("div");box.className=cls;function sync(){[...box.children].forEach(b=>b.classList.toggle("on",b.dataset.v==o.value))}
